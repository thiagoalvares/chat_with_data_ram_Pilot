<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660" font-family="Arial, sans-serif">
  <rect width="1180" height="660" fill="#FFFFFF"/>
  <text x="590" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#0A1628">Data-Egress Map — Every Network Path in the Application</text>
  <text x="590" y="60" text-anchor="middle" font-size="14" fill="#4A5568">Audited result: exactly ONE external connection — the internal LiteLLM gateway</text>

  <defs>
    <marker id="ga" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round"/></marker>
    <marker id="gg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.8" stroke-linecap="round"/></marker>
  </defs>

  <!-- Browser -->
  <rect x="45" y="120" width="190" height="150" rx="10" fill="#E8EDF5" stroke="#1B3A6B" stroke-width="1.5"/>
  <text x="140" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#0A1628">User's browser</text>
  <text x="140" y="176" text-anchor="middle" font-size="11" fill="#4A5568">UI, fonts, Chart.js —</text>
  <text x="140" y="193" text-anchor="middle" font-size="11" fill="#4A5568">ALL served from the app</text>
  <text x="140" y="210" text-anchor="middle" font-size="11" fill="#0F6E56">no CDN, no Google Fonts</text>
  <text x="140" y="235" text-anchor="middle" font-size="11" fill="#4A5568">Word/Excel/PNG exports</text>
  <text x="140" y="252" text-anchor="middle" font-size="11" fill="#4A5568">download to the user only</text>

  <!-- Server box -->
  <rect x="290" y="95" width="600" height="330" rx="14" fill="#FBFCFD" stroke="#8A9BB0" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="590" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#8A9BB0">COMPANY SERVER (single box)</text>

  <rect x="315" y="140" width="250" height="130" rx="8" fill="#0A1628"/>
  <text x="440" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">.NET front end (IIS)</text>
  <text x="440" y="192" text-anchor="middle" font-size="11" fill="#B8C4D0">serves UI · session cookie</text>
  <text x="440" y="210" text-anchor="middle" font-size="11" fill="#B8C4D0">proxies to Python on localhost</text>
  <text x="440" y="234" text-anchor="middle" font-size="11" fill="#9FE1CB">outbound: localhost:8000 ONLY</text>

  <rect x="610" y="140" width="250" height="170" rx="8" fill="#F5F6F8" stroke="#1B3A6B" stroke-width="1.5"/>
  <text x="735" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#0A1628">Python service</text>
  <text x="735" y="188" text-anchor="middle" font-size="11" fill="#4A5568">two-call pipeline · pandas</text>
  <rect x="628" y="200" width="214" height="60" rx="6" fill="#E7F5EE" stroke="#0F6E56"/>
  <text x="735" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#085041">All data in RAM only</text>
  <text x="735" y="240" text-anchor="middle" font-size="10.5" fill="#0F6E56">never written to disk or DB</text>
  <text x="735" y="288" text-anchor="middle" font-size="11" fill="#4A5568">one network call site: llm.py</text>

  <rect x="315" y="330" width="545" height="70" rx="8" fill="#F5F6F8" stroke="#C8CED8"/>
  <text x="335" y="356" font-size="11.5" font-weight="bold" fill="#0A1628">Local writes only:</text>
  <text x="335" y="378" font-size="11" fill="#4A5568">app logs (local file) · exports streamed to the requesting user · no database, no telemetry, no analytics</text>

  <!-- Gateway -->
  <rect x="945" y="150" width="195" height="150" rx="10" fill="#E7F5EE" stroke="#0F6E56" stroke-width="2"/>
  <text x="1042" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">GA LiteLLM gateway</text>
  <text x="1042" y="204" text-anchor="middle" font-size="11" fill="#0F6E56">aigateway.ga.com</text>
  <text x="1042" y="228" text-anchor="middle" font-size="11" fill="#0F6E56">company-internal service</text>
  <text x="1042" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#085041">the ONLY external</text>
  <text x="1042" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#085041">connection</text>

  <!-- arrows -->
  <line x1="235" y1="195" x2="313" y2="195" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ga)"/>
  <text x="274" y="187" text-anchor="middle" font-size="10" fill="#4A5568">HTTPS</text>
  <line x1="565" y1="205" x2="608" y2="205" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ga)"/>
  <text x="587" y="197" text-anchor="middle" font-size="9.5" fill="#4A5568">localhost</text>
  <line x1="860" y1="225" x2="943" y2="225" stroke="#0F6E56" stroke-width="2.2" marker-end="url(#gg)"/>
  <text x="901" y="215" text-anchor="middle" font-size="10" font-weight="bold" fill="#085041">sanctioned</text>

  <!-- Removed / never present -->
  <rect x="45" y="460" width="1095" height="170" rx="10" fill="#FCEFEF" stroke="#E5B5B0"/>
  <text x="65" y="488" font-size="14" font-weight="bold" fill="#993C1D">Third-party connections: none</text>
  <text x="65" y="514" font-size="12" fill="#712B13">✕  Google Fonts (fonts.googleapis.com / fonts.gstatic.com) — REMOVED: fonts now self-hosted in wwwroot/fonts/</text>
  <text x="65" y="538" font-size="12" fill="#712B13">✕  Chart.js CDN (cdn.jsdelivr.net) — REMOVED: library now self-hosted in wwwroot/js/</text>
  <text x="65" y="562" font-size="12" fill="#712B13">✕  Browser voice dictation (would have sent audio to the browser vendor) — feature cancelled and deleted</text>
  <text x="65" y="586" font-size="12" fill="#712B13">✕  No analytics, no telemetry beacons, no error-reporting services, no cloud storage, no external APIs of any kind</text>
  <text x="65" y="614" font-size="11.5" fill="#993C1D">Verified by static review of every source file and a live browser network capture during a full feature exercise.</text>
</svg>
