<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, sans-serif">
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Header -->
  <rect x="0" y="0" width="1600" height="112" fill="#0A1628"/>
  <rect x="40" y="24" width="64" height="64" rx="8" fill="#FFFFFF"/>
  <image href="data:image/png;base64," x="46" y="30" width="52" height="52"/>
  <text x="122" y="55" font-size="21" font-weight="bold" fill="#FFFFFF" letter-spacing="1">GENERAL ATOMICS</text>
  <text x="122" y="80" font-size="14" fill="#9FB3D0" letter-spacing="2">AERONAUTICAL SYSTEMS</text>
  <text x="1560" y="48" text-anchor="end" font-size="30" font-weight="bold" fill="#FFFFFF">Chat with Data vs. ChatGPT — Cost at Scale</text>
  <text x="1560" y="78" text-anchor="end" font-size="16" fill="#9FB3D0">Both priced at identical GPT-5.1 rates - apples to apples · August 2026</text>

  <!-- Card 1: tokens per question -->
  <rect x="40" y="142" width="746" height="270" rx="12" fill="#FFFFFF" stroke="#C8CED8" stroke-width="1.5"/>
  <text x="70" y="184" font-size="16" font-weight="bold" fill="#5F5E5A" letter-spacing="1.5">TOKENS PER QUESTION</text>
  <text x="70" y="234" font-size="17" fill="#0A1628">Chat with Data</text>
  <rect x="70" y="246" width="106" height="30" rx="4" fill="#1B3A6B"/>
  <text x="188" y="268" font-size="16" font-weight="bold" fill="#0A1628">4,989 <tspan font-weight="normal" fill="#8A9BB0">measured</tspan></text>
  <text x="70" y="322" font-size="17" fill="#5F5E5A">ChatGPT app</text>
  <rect x="70" y="334" width="660" height="30" rx="4" fill="#8A9BB0"/>
  <text x="400" y="356" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">25,000 - 40,000 self-reported</text>
  <text x="70" y="396" font-size="18" font-weight="bold" fill="#0A1628">5-8x fewer tokens for the same question</text>

  <!-- Card 2: cost per question -->
  <rect x="814" y="142" width="746" height="270" rx="12" fill="#FFFFFF" stroke="#C8CED8" stroke-width="1.5"/>
  <text x="844" y="184" font-size="16" font-weight="bold" fill="#5F5E5A" letter-spacing="1.5">COST PER QUESTION — SAME GPT-5.1 RATES</text>
  <text x="1010" y="290" text-anchor="middle" font-size="56" font-weight="bold" fill="#1B3A6B">$0.013</text>
  <text x="1010" y="324" text-anchor="middle" font-size="16" fill="#5F5E5A">Chat with Data</text>
  <line x1="1180" y1="220" x2="1180" y2="336" stroke="#E5E8EC" stroke-width="2"/>
  <text x="1360" y="290" text-anchor="middle" font-size="56" font-weight="bold" fill="#5F5E5A">$0.06</text>
  <text x="1360" y="324" text-anchor="middle" font-size="16" fill="#5F5E5A">ChatGPT app (est. $0.04-0.09)</text>
  <rect x="844" y="356" width="686" height="40" rx="6" fill="#1B3A6B"/>
  <text x="1187" y="383" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">~78% lower cost per question</text>

  <!-- Full-width: cost as files grow -->
  <rect x="40" y="436" width="1520" height="356" rx="12" fill="#FFFFFF" stroke="#C8CED8" stroke-width="1.5"/>
  <text x="70" y="478" font-size="16" font-weight="bold" fill="#5F5E5A" letter-spacing="1.5">COST PER QUESTION AS FILES GROW</text>
  <rect x="540" y="466" width="14" height="14" rx="2" fill="#1B3A6B"/>
  <text x="560" y="478" font-size="13.5" fill="#0A1628">Chat with Data</text>
  <rect x="690" y="466" width="14" height="14" rx="2" fill="#8A9BB0"/>
  <text x="710" y="478" font-size="13.5" fill="#0A1628">ChatGPT app</text>

  <line x1="80" y1="722" x2="1090" y2="722" stroke="#C8CED8" stroke-width="1.5"/>
  <!-- 12k -->
  <rect x="150" y="704" width="84" height="18" fill="#1B3A6B" rx="3"/>
  <text x="192" y="696" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B3A6B">$0.013</text>
  <rect x="246" y="640" width="84" height="82" fill="#8A9BB0" rx="3"/>
  <text x="288" y="630" text-anchor="middle" font-size="14" font-weight="bold" fill="#5F5E5A">$0.06</text>
  <text x="240" y="752" text-anchor="middle" font-size="16" font-weight="bold" fill="#0A1628">12,000 rows</text>
  <!-- 100k -->
  <rect x="460" y="704" width="84" height="18" fill="#1B3A6B" rx="3"/>
  <text x="502" y="696" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B3A6B">$0.013</text>
  <rect x="556" y="518" width="84" height="204" fill="#8A9BB0" rx="3"/>
  <text x="598" y="508" text-anchor="middle" font-size="14" font-weight="bold" fill="#5F5E5A">$0.12 - 0.18 est.</text>
  <text x="550" y="752" text-anchor="middle" font-size="16" font-weight="bold" fill="#0A1628">100,000 rows</text>
  <!-- 500k -->
  <rect x="770" y="704" width="84" height="18" fill="#1B3A6B" rx="3"/>
  <text x="812" y="696" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B3A6B">$0.013</text>
  <g>
    <rect x="866" y="490" width="84" height="232" fill="none" stroke="#8A9BB0" stroke-width="2.5" stroke-dasharray="7 5" rx="3"/>
    <line x1="876" y1="508" x2="940" y2="704" stroke="#8A9BB0" stroke-width="2.5"/>
    <line x1="940" y1="508" x2="876" y2="704" stroke="#8A9BB0" stroke-width="2.5"/>
  </g>
  <text x="908" y="480" text-anchor="middle" font-size="14" font-weight="bold" fill="#5F5E5A">exceeds model context</text>
  <text x="860" y="752" text-anchor="middle" font-size="16" font-weight="bold" fill="#0A1628">500,000 rows</text>
  <text x="70" y="778" font-size="14" fill="#8A9BB0" font-style="italic">Flat by design: only the schema and the computed answer reach the model - never the rows.</text>

  <!-- callout inside chart card -->
  <rect x="1130" y="486" width="400" height="266" rx="10" fill="#0A1628"/>
  <text x="1160" y="530" font-size="15" font-weight="bold" fill="#9FE1CB" letter-spacing="1.5">WHY IT MATTERS</text>
  <text x="1160" y="572" font-size="17" fill="#FFFFFF">Our cost is <tspan font-weight="bold" fill="#9FE1CB">flat at any file size</tspan> —</text>
  <text x="1160" y="598" font-size="17" fill="#FFFFFF">the same $0.013 from 12k to</text>
  <text x="1160" y="624" font-size="17" fill="#FFFFFF">500k rows.</text>
  <text x="1160" y="664" font-size="17" fill="#FFFFFF">The ChatGPT app's cost <tspan font-weight="bold">grows</tspan></text>
  <text x="1160" y="690" font-size="17" fill="#FFFFFF"><tspan font-weight="bold">with the data</tspan> — and large files</text>
  <text x="1160" y="716" font-size="17" fill="#FFFFFF">eventually exceed what it can read.</text>

  <!-- bottom navy band -->
  <rect x="40" y="812" width="1520" height="46" rx="8" fill="#0A1628"/>
  <text x="800" y="842" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#FFFFFF">Same model, same rates: 5-8x fewer tokens = ~78% lower cost today — and the gap widens with every larger file.</text>

  <!-- footnotes -->
  <text x="40" y="880" font-size="12.5" fill="#8A9BB0">Both apps priced at GPT-5.1 list rates (~$1.25/M input, $10/M output). Chat with Data: 4,989 tokens measured by built-in usage tracking (~4.25k in / ~0.74k out). ChatGPT app: 25k-40k tokens self-reported (~22-36k in / 1-4k out).</text>
  <text x="40" y="896" font-size="12.5" fill="#8A9BB0">100k/500k-row ChatGPT figures are directional estimates; prompt caching may reduce repeat-question cost. Internal use - General Atomics Aeronautical Systems - Chat with Data pilot.</text>
</svg>