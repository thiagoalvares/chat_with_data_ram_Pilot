<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, sans-serif">
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Header band -->
  <rect x="0" y="0" width="1600" height="112" fill="#0A1628"/>
  <rect x="40" y="24" width="64" height="64" rx="8" fill="#FFFFFF"/>
  <image href="data:image/png;base64," x="46" y="30" width="52" height="52"/>
  <text x="122" y="55" font-size="21" font-weight="bold" fill="#FFFFFF" letter-spacing="1">GENERAL ATOMICS</text>
  <text x="122" y="80" font-size="14" fill="#9FB3D0" letter-spacing="2">AERONAUTICAL SYSTEMS</text>
  <text x="1560" y="48" text-anchor="end" font-size="30" font-weight="bold" fill="#FFFFFF">Chat with Data vs. ChatGPT</text>
  <text x="1560" y="78" text-anchor="end" font-size="16" fill="#9FB3D0">Token &amp; cost efficiency · same question, same 12,000-row file · August 2026</text>

  <!-- Card 1: tokens per question -->
  <rect x="40" y="140" width="480" height="330" rx="12" fill="#FFFFFF" stroke="#C8CED8" stroke-width="1.5"/>
  <text x="64" y="180" font-size="15" font-weight="bold" fill="#5F5E5A" letter-spacing="1.5">TOKENS PER QUESTION</text>
  <text x="64" y="238" font-size="17" fill="#0A1628">Chat with Data</text>
  <rect x="64" y="252" width="82" height="30" rx="4" fill="#1B3A6B"/>
  <text x="156" y="274" font-size="16" font-weight="bold" fill="#0A1628">~5,000</text>
  <text x="64" y="330" font-size="17" fill="#5F5E5A">ChatGPT app</text>
  <rect x="64" y="344" width="410" height="30" rx="4" fill="#8A9BB0"/>
  <rect x="392" y="344" width="82" height="30" rx="4" fill="#C8CED8"/>
  <text x="300" y="365" font-size="16" font-weight="bold" fill="#FFFFFF">25,000 – 40,000</text>
  <rect x="64" y="404" width="432" height="44" rx="6" fill="#0A1628"/>
  <text x="280" y="433" text-anchor="middle" font-size="21" font-weight="bold" fill="#FFFFFF">5–8× fewer tokens</text>

  <!-- Card 2: cost per question -->
  <rect x="552" y="140" width="480" height="330" rx="12" fill="#FFFFFF" stroke="#C8CED8" stroke-width="1.5"/>
  <text x="576" y="180" font-size="15" font-weight="bold" fill="#5F5E5A" letter-spacing="1.5">COST PER QUESTION — 12K-ROW FILE</text>
  <text x="700" y="280" text-anchor="middle" font-size="46" font-weight="bold" fill="#1B3A6B">$0.046</text>
  <text x="700" y="310" text-anchor="middle" font-size="15" fill="#5F5E5A">Chat with Data</text>
  <text x="700" y="330" text-anchor="middle" font-size="13" fill="#8A9BB0">(measured, Claude Sonnet)</text>
  <line x1="800" y1="220" x2="800" y2="340" stroke="#E5E8EC" stroke-width="2"/>
  <text x="915" y="280" text-anchor="middle" font-size="46" font-weight="bold" fill="#5F5E5A">~$0.06</text>
  <text x="915" y="310" text-anchor="middle" font-size="15" fill="#5F5E5A">ChatGPT app</text>
  <text x="915" y="330" text-anchor="middle" font-size="13" fill="#8A9BB0">(est. $0.04–$0.09, GPT-5.1)</text>
  <rect x="576" y="404" width="432" height="44" rx="6" fill="#ECEEF2"/>
  <text x="792" y="432" text-anchor="middle" font-size="17" font-weight="bold" fill="#0A1628">Cost-competitive today — up to ~45% lower</text>

  <!-- Card 3: why -->
  <rect x="1064" y="140" width="496" height="330" rx="12" fill="#FFFFFF" stroke="#C8CED8" stroke-width="1.5"/>
  <text x="1088" y="180" font-size="15" font-weight="bold" fill="#5F5E5A" letter-spacing="1.5">WHY — THE MODEL NEVER READS THE DATA</text>
  <rect x="1088" y="204" width="200" height="52" rx="6" fill="#ECEEF2"/>
  <text x="1188" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#0A1628">Schema + 3 sample rows</text>
  <text x="1188" y="245" text-anchor="middle" font-size="12.5" fill="#5F5E5A">only this goes to the AI</text>
  <path d="M1288 230 L1318 230" stroke="#8A9BB0" stroke-width="2.5" fill="none"/>
  <path d="M1312 224 L1320 230 L1312 236" stroke="#8A9BB0" stroke-width="2.5" fill="none"/>
  <rect x="1326" y="204" width="200" height="52" rx="6" fill="#1B3A6B"/>
  <text x="1426" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">AI writes analysis code</text>
  <text x="1426" y="245" text-anchor="middle" font-size="12.5" fill="#9FB3D0">pandas, runs on our server</text>
  <path d="M1426 262 L1426 286" stroke="#8A9BB0" stroke-width="2.5" fill="none"/>
  <path d="M1420 280 L1426 288 L1432 280" stroke="#8A9BB0" stroke-width="2.5" fill="none"/>
  <rect x="1326" y="294" width="200" height="52" rx="6" fill="#ECEEF2"/>
  <text x="1426" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#0A1628">Computed answer</text>
  <text x="1426" y="335" text-anchor="middle" font-size="12.5" fill="#5F5E5A">calculated, not estimated</text>
  <text x="1088" y="300" font-size="14.5" fill="#5F5E5A">The ChatGPT app pulls chunks of the</text>
  <text x="1088" y="322" font-size="14.5" fill="#5F5E5A">file + its agent runtime into every</text>
  <text x="1088" y="344" font-size="14.5" fill="#5F5E5A">request — tokens grow with the data.</text>
  <rect x="1088" y="404" width="448" height="44" rx="6" fill="#0A1628"/>
  <text x="1312" y="432" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Every number is computed &amp; auditable</text>

  <!-- Wide card: scaling -->
  <rect x="40" y="498" width="1000" height="316" rx="12" fill="#FFFFFF" stroke="#C8CED8" stroke-width="1.5"/>
  <text x="64" y="538" font-size="15" font-weight="bold" fill="#5F5E5A" letter-spacing="1.5">THE DECISIVE DIFFERENCE — COST AS FILES GROW</text>
  <!-- legend -->
  <rect x="700" y="524" width="14" height="14" rx="2" fill="#1B3A6B"/>
  <text x="720" y="536" font-size="13.5" fill="#0A1628">Chat with Data</text>
  <rect x="850" y="524" width="14" height="14" rx="2" fill="#8A9BB0"/>
  <text x="870" y="536" font-size="13.5" fill="#0A1628">ChatGPT app</text>
  <!-- baseline -->
  <line x1="80" y1="740" x2="1000" y2="740" stroke="#C8CED8" stroke-width="1.5"/>
  <!-- group 12k -->
  <rect x="150" y="712" width="70" height="28" fill="#1B3A6B" rx="3"/>
  <text x="185" y="704" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1B3A6B">$0.05</text>
  <rect x="230" y="700" width="70" height="40" fill="#8A9BB0" rx="3"/>
  <text x="265" y="692" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#5F5E5A">~$0.06</text>
  <text x="225" y="768" text-anchor="middle" font-size="15" font-weight="bold" fill="#0A1628">12,000 rows</text>
  <!-- group 100k -->
  <rect x="450" y="712" width="70" height="28" fill="#1B3A6B" rx="3"/>
  <text x="485" y="704" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1B3A6B">$0.05</text>
  <rect x="530" y="640" width="70" height="100" fill="#8A9BB0" rx="3"/>
  <text x="565" y="632" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#5F5E5A">~$0.12–0.18 est.</text>
  <text x="525" y="768" text-anchor="middle" font-size="15" font-weight="bold" fill="#0A1628">100,000 rows</text>
  <!-- group 500k -->
  <rect x="750" y="712" width="70" height="28" fill="#1B3A6B" rx="3"/>
  <text x="785" y="704" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1B3A6B">$0.05</text>
  <g>
    <rect x="830" y="580" width="70" height="160" fill="none" stroke="#8A9BB0" stroke-width="2" stroke-dasharray="6 4" rx="3"/>
    <line x1="838" y1="596" x2="892" y2="724" stroke="#8A9BB0" stroke-width="2"/>
    <line x1="892" y1="596" x2="838" y2="724" stroke="#8A9BB0" stroke-width="2"/>
  </g>
  <text x="865" y="572" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#5F5E5A">exceeds model context</text>
  <text x="805" y="768" text-anchor="middle" font-size="15" font-weight="bold" fill="#0A1628">500,000 rows</text>
  <text x="64" y="800" font-size="13.5" fill="#8A9BB0" font-style="italic">Chat with Data stays flat: token use depends on the schema and the answer — never the row count.</text>

  <!-- takeaway panel -->
  <rect x="1064" y="498" width="496" height="316" rx="12" fill="#0A1628"/>
  <text x="1088" y="540" font-size="15" font-weight="bold" fill="#9FE1CB" letter-spacing="1.5">BOTTOM LINE FOR LEADERSHIP</text>
  <text x="1088" y="582" font-size="17.5" fill="#FFFFFF">5–8× more token-efficient today, and</text>
  <text x="1088" y="608" font-size="17.5" fill="#FFFFFF">cost-competitive per question.</text>
  <text x="1088" y="650" font-size="17.5" fill="#FFFFFF">At scale, the gap becomes decisive:</text>
  <text x="1088" y="676" font-size="17.5" fill="#FFFFFF">our cost and reliability are <tspan font-weight="bold" fill="#9FE1CB">flat from</tspan></text>
  <text x="1088" y="702" font-size="17.5" font-weight="bold" fill="#9FE1CB">12k to 500k rows.</text>
  <text x="1088" y="744" font-size="17.5" fill="#FFFFFF">And every answer is <tspan font-weight="bold">computed and</tspan></text>
  <text x="1088" y="770" font-size="17.5" fill="#FFFFFF"><tspan font-weight="bold">auditable</tspan> — not read-and-estimated.</text>

  <!-- footnote -->
  <text x="40" y="850" font-size="12.5" fill="#8A9BB0">Assumptions: Chat with Data figures measured by the app's built-in usage tracking (4,989 tokens, $0.046, Claude Sonnet via LiteLLM). ChatGPT token range self-reported by the ChatGPT app (25k-40k).</text>
  <text x="40" y="868" font-size="12.5" fill="#8A9BB0">ChatGPT cost estimated at GPT-5.1 list rates (~$1.25/M input, $10/M output) - gateway rates may differ. 100k/500k ChatGPT figures are directional estimates; prompt caching may reduce repeat-question cost.</text>
  <text x="40" y="886" font-size="12.5" fill="#8A9BB0">Internal use - General Atomics Aeronautical Systems - Chat with Data pilot</text>
</svg>