<svg xmlns="http://www.w3.org/2000/svg" width="680" height="800" viewBox="0 0 680 800" font-family="Arial, sans-serif">
  <rect width="680" height="800" fill="#FFFFFF"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

  <rect x="215" y="24" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="233" y="35" font-size="12" fill="#4A5568">.NET track</text>
  <rect x="330" y="24" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="348" y="35" font-size="12" fill="#4A5568">Python track (by hand)</text>

  <rect x="215" y="50" width="250" height="54" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="231" y="72" font-size="14" font-weight="bold" fill="#2C2C2A">1 · Prep and access</text>
  <text x="231" y="90" font-size="12" fill="#5F5E5A">licenses · Citrix · Okta · AI key</text>
  <line x1="340" y1="104" x2="340" y2="132" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="215" y="136" width="250" height="54" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <text x="231" y="158" font-size="14" font-weight="bold" fill="#633806">2 · MCCI check</text>
  <text x="231" y="176" font-size="12" fill="#854F0B">Python allowed on this server?</text>
  <rect x="490" y="136" width="150" height="54" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="504" y="158" font-size="14" font-weight="bold" fill="#2C2C2A">MCCI provides</text>
  <text x="504" y="176" font-size="12" fill="#5F5E5A">a small VM instead</text>
  <line x1="465" y1="163" x2="486" y2="163" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="468" y="155" font-size="12" fill="#5F5E5A">no</text>
  <line x1="340" y1="190" x2="340" y2="218" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="208" font-size="12" fill="#5F5E5A">yes</text>
  <path d="M565 190 V253 H471" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="215" y="226" width="250" height="54" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="231" y="248" font-size="14" font-weight="bold" fill="#26215C">3 · Code to BitBucket</text>
  <text x="231" y="266" font-size="12" fill="#534AB7">open and build in Visual Studio</text>

  <path d="M340 280 V310 H190 V332" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 280 V310 H490 V332" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="65" y="340" width="250" height="54" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="81" y="362" font-size="14" font-weight="bold" fill="#26215C">4 · Jenkins builds package</text>
  <text x="81" y="380" font-size="12" fill="#534AB7">from the BitBucket repo</text>
  <rect x="365" y="340" width="250" height="54" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="381" y="362" font-size="14" font-weight="bold" fill="#04342C">4 · Install Python on server</text>
  <text x="381" y="380" font-size="12" fill="#0F6E56">via Citrix · venv · .env key</text>

  <line x1="190" y1="394" x2="190" y2="426" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="394" x2="490" y2="426" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="65" y="430" width="250" height="54" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="81" y="452" font-size="14" font-weight="bold" fill="#26215C">5 · Octopus deploys to IIS</text>
  <text x="81" y="470" font-size="12" fill="#534AB7">website and app pool created</text>
  <rect x="365" y="430" width="250" height="54" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="381" y="452" font-size="14" font-weight="bold" fill="#04342C">5 · Run as Windows service</text>
  <text x="381" y="470" font-size="12" fill="#0F6E56">NSSM · one process only</text>

  <path d="M190 484 V510 H300 V532" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M490 484 V510 H380 V532" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="215" y="540" width="250" height="54" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="231" y="562" font-size="14" font-weight="bold" fill="#2C2C2A">6 · Connect in IIS</text>
  <text x="231" y="580" font-size="12" fill="#5F5E5A">Hosting Bundle · localhost:8000</text>
  <line x1="340" y1="594" x2="340" y2="622" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="215" y="630" width="250" height="54" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
  <text x="231" y="652" font-size="14" font-weight="bold" fill="#2C2C2A">7 · Verify it works</text>
  <text x="231" y="670" font-size="12" fill="#5F5E5A">healthz · upload · ask</text>
  <line x1="340" y1="684" x2="340" y2="712" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="215" y="720" width="250" height="54" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
  <text x="231" y="742" font-size="14" font-weight="bold" fill="#173404">8 · Go live</text>
  <text x="231" y="760" font-size="12" fill="#3B6D11">Windows Auth on · pilot first</text>
</svg>
