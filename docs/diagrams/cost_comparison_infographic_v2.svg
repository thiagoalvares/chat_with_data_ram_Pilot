<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, sans-serif">
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Header -->
  <rect x="0" y="0" width="1600" height="112" fill="#0A1628"/>
  <rect x="40" y="24" width="64" height="64" rx="8" fill="#FFFFFF"/>
  <image href="data:image/png;base64," x="46" y="30" width="52" height="52"/>
  <text x="122" y="55" font-size="21" font-weight="bold" fill="#FFFFFF" letter-spacing="1">GENERAL ATOMICS</text>
  <text x="122" y="80" font-size="14" fill="#9FB3D0" letter-spacing="2">AERONAUTICAL SYSTEMS</text>
  <text x="1560" y="48" text-anchor="end" font-size="30" font-weight="bold" fill="#FFFFFF">Chat with Data vs. ChatGPT — Cost at Scale</text>
  <text x="1560" y="78" text-anchor="end" font-size="16" fill="#9FB3D0">Both priced at identical GPT-5.1 rates - apples to apples · August 2026</text>

  <!-- Card 1: tokens -->
  <rect x="40" y="140" width="486" height="280" rx="12" fill="#FFFFFF" stroke="#C8CED8" stroke-width="1.5"/>
  <text x="64" y="178" font-size="15" font-weight="bold" fill="#5F5E5A" letter-spacing="1.5">TOKENS PER QUESTION</text>
  <text x="64" y="226" font-size="16" fill="#0A1628">Chat with Data</text>
  <rect x="64" y="238" width="78" height="26" rx="4" fill="#1B3A6B"/>
  <text x="152" y="257" font-size="15" font-weight="bold" fill="#0A1628">4,989 measured</text>
  <text x="64" y="306" font-size="16" fill="#5F5E5A">ChatGPT app</text>
  <rect x="64" y="318" width="400" height="26" rx="4" fill="#8A9BB0"/>
  <text x="264" y="337" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">25,000 - 40,000 self-reported</text>
  <rect x="64" y="366" width="438" height="38" rx="6" fill="#0A1628"/>
  <text x="283" y="391" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">5-8x fewer tokens per question</text>

  <!-- Card 2: cost per question, same rates -->
  <rect x="556" y="140" width="486" height="280" rx="12" fill="#FFFFFF" stroke="#C8CED8" stroke-width="1.5"/>
  <text x="580" y="178" font-size="15" font-weight="bold" fill="#5F5E5A" letter-spacing="1.5">COST PER QUESTION — SAME GPT-5.1 RATES</text>
  <text x="700" y="266" text-anchor="middle" font-size="44" font-weight="bold" fill="#1B3A6B">$0.013</text>
  <text x="700" y="296" text-anchor="middle" font-size="15" fill="#5F5E5A">Chat with Data</text>
  <line x1="798" y1="212" x2="798" y2="310" stroke="#E5E8EC" stroke-width="2"/>
  <text x="908" y="266" text-anchor="middle" font-size="44" font-weight="bold" fill="#5F5E5A">$0.06</text>
  <text x="908" y="296" text-anchor="middle" font-size="15" fill="#5F5E5A">ChatGPT app (est. $0.04-0.09)</text>
  <rect x="580" y="366" width="438" height="38" rx="6" fill="#1B3A6B"/>
  <text x="799" y="391" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">~78% lower cost per question</text>
  <text x="580" y="340" font-size="13" fill="#8A9BB0">Same tokens, same rate card - the efficiency IS the saving.</text>

  <!-- Card 3: per 1,000 questions -->
  <rect x="1072" y="140" width="488" height="280" rx="12" fill="#FFFFFF" stroke="#C8CED8" stroke-width="1.5"/>
  <text x="1096" y="178" font-size="15" font-weight="bold" fill="#5F5E5A" letter-spacing="1.5">COST PER 1,000 QUESTIONS</text>
  <text x="1096" y="222" font-size="14.5" fill="#0A1628">Chat with Data</text>
  <rect x="1096" y="232" width="34" height="24" rx="3" fill="#1B3A6B"/>
  <text x="1140" y="250" font-size="15" font-weight="bold" fill="#1B3A6B">$13</text>
  <text x="1096" y="290" font-size="14.5" fill="#5F5E5A">ChatGPT - typical file (12k rows)</text>
  <rect x="1096" y="300" width="155" height="24" rx="3" fill="#8A9BB0"/>
  <text x="1261" y="318" font-size="15" font-weight="bold" fill="#5F5E5A">$60</text>
  <text x="1096" y="358" font-size="14.5" fill="#5F5E5A">ChatGPT - large file (100k rows, est.)</text>
  <rect x="1096" y="368" width="390" height="24" rx="3" fill="#5F5E5A"/>
  <text x="1300" y="386" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">$120 - $180</text>

  <!-- Row 2 left: per-question cost as files grow -->
  <rect x="40" y="444" width="760" height="330" rx="12" fill="#FFFFFF" stroke="#C8CED8" stroke-width="1.5"/>
  <text x="64" y="482" font-size="15" font-weight="bold" fill="#5F5E5A" letter-spacing="1.5">COST PER QUESTION AS FILES GROW</text>
  <rect x="520" y="468" width="13" height="13" rx="2" fill="#1B3A6B"/>
  <text x="539" y="479" font-size="13" fill="#0A1628">Chat with Data</text>
  <rect x="650" y="468" width="13" height="13" rx="2" fill="#8A9BB0"/>
  <text x="669" y="479" font-size="13" fill="#0A1628">ChatGPT app</text>
  <line x1="70" y1="690" x2="770" y2="690" stroke="#C8CED8" stroke-width="1.5"/>
  <!-- 12k -->
  <rect x="120" y="676" width="60" height="14" fill="#1B3A6B" rx="2"/>
  <text x="150" y="668" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1B3A6B">$0.013</text>
  <rect x="190" y="630" width="60" height="60" fill="#8A9BB0" rx="2"/>
  <text x="220" y="622" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5F5E5A">$0.06</text>
  <text x="185" y="716" text-anchor="middle" font-size="14" font-weight="bold" fill="#0A1628">12,000 rows</text>
  <!-- 100k -->
  <rect x="350" y="676" width="60" height="14" fill="#1B3A6B" rx="2"/>
  <text x="380" y="668" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1B3A6B">$0.013</text>
  <rect x="420" y="540" width="60" height="150" fill="#8A9BB0" rx="2"/>
  <text x="450" y="532" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5F5E5A">$0.12-0.18 est.</text>
  <text x="415" y="716" text-anchor="middle" font-size="14" font-weight="bold" fill="#0A1628">100,000 rows</text>
  <!-- 500k -->
  <rect x="580" y="676" width="60" height="14" fill="#1B3A6B" rx="2"/>
  <text x="610" y="668" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1B3A6B">$0.013</text>
  <g>
    <rect x="650" y="520" width="60" height="170" fill="none" stroke="#8A9BB0" stroke-width="2" stroke-dasharray="6 4" rx="2"/>
    <line x1="657" y1="534" x2="703" y2="676" stroke="#8A9BB0" stroke-width="2"/>
    <line x1="703" y1="534" x2="657" y2="676" stroke="#8A9BB0" stroke-width="2"/>
  </g>
  <text x="680" y="512" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5F5E5A">exceeds context</text>
  <text x="645" y="716" text-anchor="middle" font-size="14" font-weight="bold" fill="#0A1628">500,000 rows</text>
  <text x="64" y="752" font-size="13.5" fill="#8A9BB0" font-style="italic">Flat by design: only the schema and the computed answer reach the model - never the rows.</text>

  <!-- Row 2 right: annual projection -->
  <rect x="824" y="444" width="736" height="330" rx="12" fill="#FFFFFF" stroke="#C8CED8" stroke-width="1.5"/>
  <text x="848" y="482" font-size="15" font-weight="bold" fill="#5F5E5A" letter-spacing="1.5">WHAT THAT MEANS PER YEAR — 350 USERS, ~84,000 QUESTIONS</text>
  <text x="848" y="530" font-size="14.5" fill="#0A1628">Chat with Data <tspan fill="#8A9BB0">(any file size)</tspan></text>
  <rect x="848" y="542" width="52" height="28" rx="3" fill="#1B3A6B"/>
  <text x="910" y="563" font-size="17" font-weight="bold" fill="#1B3A6B">~$1,100</text>
  <text x="848" y="612" font-size="14.5" fill="#5F5E5A">ChatGPT app - typical files</text>
  <rect x="848" y="624" width="240" height="28" rx="3" fill="#8A9BB0"/>
  <text x="1098" y="645" font-size="17" font-weight="bold" fill="#5F5E5A">~$5,000</text>
  <text x="848" y="694" font-size="14.5" fill="#5F5E5A">ChatGPT app - large files (est.)</text>
  <rect x="848" y="706" width="600" height="28" rx="3" fill="#5F5E5A"/>
  <text x="1148" y="727" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">$10,000 - $15,000</text>
  <rect x="1180" y="510" width="356" height="120" rx="10" fill="#0A1628"/>
  <text x="1358" y="552" text-anchor="middle" font-size="16.5" fill="#FFFFFF">Annual savings</text>
  <text x="1358" y="586" text-anchor="middle" font-size="27" font-weight="bold" fill="#9FE1CB">$4K - $14K / year</text>
  <text x="1358" y="614" text-anchor="middle" font-size="15.5" fill="#9FB3D0">78% - 91% lower spend</text>

  <!-- bottom navy band -->
  <rect x="40" y="798" width="1520" height="50" rx="8" fill="#0A1628"/>
  <text x="800" y="830" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#FFFFFF">Same model, same rates: 5-8x fewer tokens = ~78% lower cost today — and the gap widens with every larger file.</text>

  <!-- footnotes -->
  <text x="40" y="872" font-size="12.5" fill="#8A9BB0">Both apps priced at GPT-5.1 list rates (~$1.25/M input, $10/M output). Chat with Data: 4,989 tokens measured by built-in usage tracking (~4.25k in / ~0.74k out). ChatGPT app: 25k-40k tokens self-reported (~22-36k in / 1-4k out).</text>
  <text x="40" y="890" font-size="12.5" fill="#8A9BB0">Annual projection assumes 350 users x 20 questions/month. 100k/500k-row ChatGPT figures are directional estimates. Internal use - General Atomics Aeronautical Systems - Chat with Data pilot.</text>
</svg>