<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" font-family="Arial, sans-serif">
  <rect width="1180" height="640" fill="#FFFFFF"/>
  <text x="590" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#0A1628">In-RAM Single-Server Architecture (Option 1)</text>
  <text x="590" y="60" text-anchor="middle" font-size="14" fill="#4A5568">All session state held in the Python process memory for fast follow-up responses</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1B3A6B"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#D97706"/></marker>
  </defs>

  <!-- Browser -->
  <rect x="40" y="140" width="180" height="120" rx="10" fill="#E8EDF5" stroke="#1B3A6B" stroke-width="2"/>
  <text x="130" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#0A1628">Browser</text>
  <text x="130" y="196" text-anchor="middle" font-size="12" fill="#4A5568">Standard / Variance UI</text>
  <text x="130" y="214" text-anchor="middle" font-size="12" fill="#4A5568">charts · Excel / PNG</text>
  <text x="130" y="232" text-anchor="middle" font-size="12" fill="#4A5568">Query &amp; Calc panel</text>

  <!-- The single server (dashed container) -->
  <rect x="270" y="100" width="620" height="430" rx="14" fill="#FBFCFD" stroke="#8A9BB0" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="580" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#8A9BB0">ONE SERVER</text>

  <!-- .NET -->
  <rect x="295" y="150" width="230" height="330" rx="10" fill="#0A1628"/>
  <text x="410" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">.NET Front End</text>
  <text x="410" y="200" text-anchor="middle" font-size="12" fill="#B8C4D0">ASP.NET Core / IIS</text>
  <rect x="315" y="220" width="190" height="70" rx="6" fill="#1B3A6B"/>
  <text x="410" y="244" text-anchor="middle" font-size="12" fill="#FFFFFF">Serves UI</text>
  <text x="410" y="262" text-anchor="middle" font-size="12" fill="#FFFFFF">session cookie (cwd_sid)</text>
  <text x="410" y="280" text-anchor="middle" font-size="11" fill="#B8C4D0">Windows Auth (optional)</text>
  <rect x="315" y="300" width="190" height="66" rx="6" fill="#1B3A6B"/>
  <text x="410" y="326" text-anchor="middle" font-size="12" fill="#FFFFFF">Proxies data calls</text>
  <text x="410" y="344" text-anchor="middle" font-size="12" fill="#FFFFFF">+ X-Session-Id</text>
  <text x="410" y="410" text-anchor="middle" font-size="11" fill="#B8C4D0">no analytical logic</text>

  <!-- Python one process -->
  <rect x="560" y="150" width="305" height="330" rx="10" fill="#F5F6F8" stroke="#1B3A6B" stroke-width="2"/>
  <text x="712" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#0A1628">Python — ONE process</text>
  <text x="712" y="199" text-anchor="middle" font-size="12" fill="#4A5568">Flask + waitress (threads)</text>
  <rect x="580" y="214" width="265" height="86" rx="6" fill="#FFFFFF" stroke="#C8CED8"/>
  <text x="712" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#0A1628">Two-call pipeline (UNCHANGED)</text>
  <text x="712" y="254" text-anchor="middle" font-size="11" fill="#4A5568">1 · generate pandas code (T=0)</text>
  <text x="712" y="272" text-anchor="middle" font-size="11" fill="#4A5568">2 · execute · explain + chart</text>
  <text x="712" y="290" text-anchor="middle" font-size="11" fill="#00875A">llm.py · executor.py · prompts/</text>

  <!-- RAM store -->
  <rect x="580" y="312" width="265" height="150" rx="6" fill="#E7F5EF" stroke="#00875A" stroke-width="1.8"/>
  <text x="712" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#0A1628">In-RAM session store</text>
  <text x="712" y="353" text-anchor="middle" font-size="11" fill="#4A5568">STORAGE_BACKEND = memory</text>
  <rect x="596" y="364" width="110" height="40" rx="5" fill="#FFFFFF" stroke="#B6E3D0"/>
  <text x="651" y="382" text-anchor="middle" font-size="10" fill="#4A5568">user A: DataFrame,</text>
  <text x="651" y="396" text-anchor="middle" font-size="10" fill="#4A5568">history, last result</text>
  <rect x="718" y="364" width="110" height="40" rx="5" fill="#FFFFFF" stroke="#B6E3D0"/>
  <text x="773" y="382" text-anchor="middle" font-size="10" fill="#4A5568">user B: DataFrame,</text>
  <text x="773" y="396" text-anchor="middle" font-size="10" fill="#4A5568">history, last result</text>
  <text x="712" y="428" text-anchor="middle" font-size="10.5" fill="#00875A">follow-ups reuse RAM — no disk / DB reload</text>
  <text x="712" y="446" text-anchor="middle" font-size="10.5" fill="#C0392B">restart clears sessions (nothing persisted)</text>

  <!-- LLM gateway -->
  <rect x="945" y="230" width="195" height="120" rx="10" fill="#FDF1E7" stroke="#D97706" stroke-width="1.5"/>
  <text x="1042" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#0A1628">LLM Gateway</text>
  <text x="1042" y="286" text-anchor="middle" font-size="11" fill="#4A5568">GA LiteLLM (internal)</text>
  <text x="1042" y="306" text-anchor="middle" font-size="11" fill="#4A5568">claude-sonnet</text>
  <text x="1042" y="330" text-anchor="middle" font-size="11" fill="#4A5568">needs VPN / GA network</text>

  <!-- arrows -->
  <line x1="220" y1="200" x2="293" y2="200" stroke="#1B3A6B" stroke-width="2" marker-end="url(#a)"/>
  <text x="256" y="192" text-anchor="middle" font-size="10" fill="#4A5568">HTTP</text>
  <line x1="525" y1="330" x2="558" y2="330" stroke="#1B3A6B" stroke-width="2" marker-end="url(#a)"/>
  <text x="542" y="322" text-anchor="middle" font-size="9.5" fill="#4A5568">localhost</text>
  <line x1="865" y1="270" x2="943" y2="280" stroke="#D97706" stroke-width="2" marker-end="url(#ag)"/>

  <!-- footer callout -->
  <rect x="40" y="560" width="1100" height="60" rx="10" fill="#E8EDF5" stroke="#1B3A6B"/>
  <text x="60" y="585" font-size="12.5" fill="#0A1628"><tspan font-weight="bold">Not needed in this edition:</tspan> no SQL Server, no network file share, no load balancer. One process, one box — simplest and lowest cost.</text>
  <text x="60" y="606" font-size="12.5" fill="#0A1628"><tspan font-weight="bold">Concurrency:</tspan> threads within the single process (the workload is I/O-bound, mostly waiting on the LLM gateway).</text>
</svg>
